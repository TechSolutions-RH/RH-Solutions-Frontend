<header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <div class="flex-shrink-0">
          <img 
            src="assets/logoTS.png" 
            alt="Tech Solutions Logo" 
            class="w-10 h-10 object-contain"
          />
        </div>
        <div class="flex flex-col">
          <h1 class="text-lg font-bold text-gray-900 dark:text-white tracking-tight leading-none">
            Painel Gerencial
          </h1>
          <span class="text-xs text-gray-500 dark:text-gray-400 font-medium">
            TechnologySolutions
          </span>
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <app-dark-mode-toggle></app-dark-mode-toggle>
        <div class="relative">
          <button 
            (click)="toggleUserMenu()"
            class="flex items-center space-x-3 text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-lg p-2 transition-colors"
          >
            <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center shadow-sm">
              <lucide-icon [img]="User" class="w-4 h-4 text-white"></lucide-icon>
            </div>
            
            <!-- User Info (hidden on mobile) -->
            <div class="hidden md:block text-left">
              <div class="text-sm font-semibold text-gray-900 dark:text-white">
                {{ userName }}
              </div>
              <div class="text-xs text-gray-500 dark:text-gray-400 font-medium">
                {{ userRole }}
              </div>
            </div>
            
            <!-- Dropdown Arrow -->
            <svg 
              class="w-4 h-4 transition-transform"
              [class.rotate-180]="showUserMenu"
              fill="none" 
              stroke="currentColor" 
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div 
            *ngIf="showUserMenu"
            class="absolute right-0 mt-2 w-64 bg-white/95 dark:bg-gray-800/95 backdrop-blur-md rounded-lg shadow-lg border border-gray-200/50 dark:border-gray-700/50 py-1 z-50"
            (click)="closeUserMenu()"
          >
            <!-- User Info Header no Menu -->
            <div class="px-4 py-3 border-b border-gray-200/50 dark:border-gray-700/50">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center">
                  <lucide-icon [img]="User" class="w-5 h-5 text-white"></lucide-icon>
                </div>
                <div>
                  <div class="text-sm font-semibold text-gray-900 dark:text-white">
                    {{ userName }}
                  </div>
                  <div class="flex items-center space-x-2 mt-1">
                    <span 
                      class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium shadow-sm"
                      [ngClass]="getRoleBadgeClass()"
                    >
                      {{ userRole }}
                    </span>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Menu Options -->
            <div class="py-1">
              <a 
                href="#" 
                class="flex items-center space-x-3 px-4 py-3 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100/50 dark:hover:bg-gray-700/50 transition-colors"
                (click)="closeUserMenu()"
              >
                <lucide-icon [img]="User" class="w-4 h-4"></lucide-icon>
                <span>Meu Perfil</span>
              </a>
              
              <button 
                (click)="logout()"
                class="w-full flex items-center space-x-3 px-4 py-3 text-sm font-medium text-red-600 dark:text-red-400 hover:bg-red-50/50 dark:hover:bg-red-900/20 transition-colors"
              >
                <lucide-icon [img]="LogOut" class="w-4 h-4"></lucide-icon>
                <span>Sair do Sistema</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Overlay para fechar menu (mobile) -->
  <div 
    *ngIf="showUserMenu"
    class="fixed inset-0 z-40"
    (click)="closeUserMenu()"
  ></div>
</header>
